<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Registration Wizard</title>
</head>
<body>
  <div class="stepper-header">
    <h1>Step 2: Profile Details</h1>
  </div>

  <form id="wizard-form">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="fullname">
    </div>
    <div class="field">
      <label>Organization</label>
      <input type="text" id="org">
    </div>

    <div class="button-row">
      <button type="button" class="btn-prev">Back</button>
      <button type="submit" class="btn-next">Next Step</button>
    </div>
  </form>
</body>
</html>

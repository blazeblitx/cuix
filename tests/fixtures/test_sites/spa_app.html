<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Taskflow — Interactive Web App</title>
</head>
<body>
  <div class="app-container">
    <div class="tab-bar" role="navigation">
      <div class="tab active" role="button">My Tasks</div>
      <div class="tab" role="button">Team Board</div>
    </div>

    <div class="filter-toolbar">
      <input type="text" class="quick-filter" placeholder="Filter tasks by tag...">
      <div class="custom-dropdown-btn" role="button" aria-label="Sort options">Sort: Priority</div>
    </div>

    <div class="task-list">
      <div class="task-item">
        <h3>Design Architecture Diagram</h3>
        <button class="action-btn">Complete</button>
      </div>
    </div>
  </div>
</body>
</html>
